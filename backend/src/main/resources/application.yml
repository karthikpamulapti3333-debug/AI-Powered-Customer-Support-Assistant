server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: resolveai-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# General App Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms:  ${JWT_EXPIRATION_MS:86400000}

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}


# Swagger UI / OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha


---
# DEVELOPMENT PROFILE
# Uses H2 In-Memory Database
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:resolveai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_UPPER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration


---
# PRODUCTION PROFILE
# Uses MySQL 8
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
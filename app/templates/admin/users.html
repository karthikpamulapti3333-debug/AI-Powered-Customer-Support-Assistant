{% extends "base.html" %}
{% block title %}System Admin - ResolveAI{% endblock %}
{% block content %}
<div class="container py-4">
  <h3 class="fw-bold text-white mb-4"><i class="bi bi-shield-lock text-info me-2"></i> System Administrators</h3>
  <div class="glassmorphism p-4">
    <div class="table-responsive">
      <table class="table table-dark-custom align-middle">
        <thead>
          <tr class="text-muted small">
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Username</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          {% for u in users %}
            <tr>
              <td class="text-muted">{{ u.id }}</td>
              <td class="fw-bold">{{ u.full_name }}</td>
              <td>{{ u.email }}</td>
              <td class="text-info">{{ u.username }}</td>
              <td><span class="badge bg-danger">{{ u.role }}</span></td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Log In - ResolveAI{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="glassmorphism p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="fs-1 text-primary"><i class="bi bi-robot"></i></div>
          <h3 class="fw-bold text-white">Welcome Back</h3>
          <p class="text-muted small">Sign in to your ResolveAI Portal</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label text-muted small">Email or Username</label>
            <input type="text" id="loginIdInput" name="login_id" class="form-control bg-dark text-white border-secondary" required placeholder="admin@example.com or customer">
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small">Password</label>
            <input type="password" id="passwordInput" name="password" class="form-control bg-dark text-white border-secondary" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary-gradient w-100 rounded-pill py-2.5 mb-3 fw-bold">Log In</button>
        </form>

        <!-- Quick Fill Seed Credentials Box -->
        <div class="p-3 bg-dark-subtle rounded-3 border border-secondary text-center">
          <p class="text-muted small mb-2 fw-semibold">Quick Demo Login</p>
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-sm btn-outline-info rounded-pill" onclick="fillCreds('admin@example.com', 'admin123')">
              <i class="bi bi-shield-lock"></i> Admin
            </button>
            <button class="btn btn-sm btn-outline-success rounded-pill" onclick="fillCreds('customer@example.com', 'customer123')">
              <i class="bi bi-person"></i> Customer
            </button>
          </div>
        </div>

        <div class="text-center mt-4">
          <span class="text-muted small">Don't have an account? </span>
          <a href="{{ url_for('auth.register') }}" class="text-info small fw-bold">Register here</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function fillCreds(loginId, pwd) {
  document.getElementById('loginIdInput').value = loginId;
  document.getElementById('passwordInput').value = pwd;
}
</script>
{% endblock %}

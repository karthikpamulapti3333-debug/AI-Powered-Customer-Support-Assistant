{% extends "base.html" %}
{% block title %}Contact Support - ResolveAI{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="glassmorphism p-4 p-md-5">
        <h2 class="fw-bold text-white mb-2">Get in Touch</h2>
        <p class="text-muted small mb-4">Have questions? Fill out the form below or chat directly with our AI bot.</p>
        <form action="{{ url_for('main.contact') }}" method="POST">
          <div class="mb-3">
            <label class="form-label text-muted small">Your Name</label>
            <input type="text" name="name" class="form-control bg-dark text-white border-secondary" required placeholder="Jane Doe">
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small">Your Email</label>
            <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required placeholder="name@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small">Message</label>
            <textarea name="message" rows="4" class="form-control bg-dark text-white border-secondary" required placeholder="How can we help?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary-gradient w-100 rounded-pill py-2">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

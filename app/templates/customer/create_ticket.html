{% extends "base.html" %}
{% block title %}Create Support Ticket - ResolveAI{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="glassmorphism p-4 p-md-5">
        <h3 class="fw-bold text-white mb-2"><i class="bi bi-ticket-perforated text-primary me-2"></i> Submit New Support Ticket</h3>
        <p class="text-muted small mb-4">Please describe your technical or account issue in detail.</p>
        <form action="{{ url_for('tickets.create_ticket') }}" method="POST">
          <div class="mb-3">
            <label class="form-label text-muted small">Subject / Title *</label>
            <input type="text" name="subject" class="form-control bg-dark text-white border-secondary" required placeholder="e.g. Cannot access billing statements">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label text-muted small">Category</label>
              <select name="category" class="form-select bg-dark text-white border-secondary">
                <option value="GENERAL">General Support</option>
                <option value="TECHNICAL">Technical Issue</option>
                <option value="BILLING">Billing & Payments</option>
                <option value="ACCOUNT">Account Management</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label text-muted small">Priority Tier</label>
              <select name="priority" class="form-select bg-dark text-white border-secondary">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
                <option value="CRITICAL">Critical</option>
              </select>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label text-muted small">Detailed Description *</label>
            <textarea name="description" rows="5" class="form-control bg-dark text-white border-secondary" required placeholder="Describe steps to reproduce or expected behavior..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary-gradient w-100 rounded-pill py-2.5 fw-bold">Submit Support Ticket</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

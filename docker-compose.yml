version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: resolveai-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: resolveai
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    container_name: resolveai-ai-service
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models
    volumes:
      - ./ai-service/models:/app/models

  backend:
    build: ./backend
    container_name: resolveai-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - DB_URL=mysql:3306
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: resolveai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:

{% extends "base.html" %}
{% block title %}Analytics & Reports - ResolveAI Admin{% endblock %}
{% block content %}
<div class="container py-4">
  <h3 class="fw-bold text-white mb-4"><i class="bi bi-bar-chart-line text-info me-2"></i> Support Analytics & Ticket Distribution</h3>
  <div class="row g-4">
    <div class="col-md-6">
      <div class="glassmorphism p-4">
        <h6 class="fw-bold text-white mb-3">Tickets by Status</h6>
        <canvas id="statusChart" height="220"></canvas>
      </div>
    </div>
    <div class="col-md-6">
      <div class="glassmorphism p-4">
        <h6 class="fw-bold text-white mb-3">Tickets by Business Category</h6>
        <canvas id="categoryChart" height="220"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const statusCtx = document.getElementById('statusChart').getContext('2d');
  const catCtx = document.getElementById('categoryChart').getContext('2d');

  new Chart(statusCtx, {
    type: 'doughnut',
    data: {
      labels: ['OPEN', 'PENDING', 'IN_PROGRESS', 'RESOLVED', 'CLOSED'],
      datasets: [{
        data: [{{ status_data.get('OPEN', 0) }}, {{ status_data.get('PENDING', 0) }}, {{ status_data.get('IN_PROGRESS', 0) }}, {{ status_data.get('RESOLVED', 0) }}, {{ status_data.get('CLOSED', 0) }}],
        backgroundColor: ['#0ea5e9', '#f59e0b', '#6366f1', '#10b981', '#64748b']
      }]
    },
    options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } } }
  });

  new Chart(catCtx, {
    type: 'bar',
    data: {
      labels: ['GENERAL', 'TECHNICAL', 'BILLING', 'ACCOUNT'],
      datasets: [{
        label: 'Tickets Count',
        data: [{{ category_data.get('GENERAL', 0) }}, {{ category_data.get('TECHNICAL', 0) }}, {{ category_data.get('BILLING', 0) }}, {{ category_data.get('ACCOUNT', 0) }}],
        backgroundColor: '#0ea5e9'
      }]
    },
    options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#fff' } }, y: { ticks: { color: '#fff' } } } }
  });
});
</script>
{% endblock %}
